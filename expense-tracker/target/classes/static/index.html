<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .summary-amount { font-size: 2rem; font-weight: 700; color: #0d6efd; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Personal Expense Tracker</h2>
        <a href="/h2-console" target="_blank" class="btn btn-outline-secondary btn-sm">Open H2 Database Console</a>
    </div>

    <!-- Top Summary Row -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card p-3 h-100">
                <span class="text-muted small text-uppercase fw-semibold">Total Spent (Current Month)</span>
                <div class="summary-amount mt-2" id="totalSpent">₹0.00</div>
                <small class="text-muted mt-auto" id="dateRangeText"></small>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-3 h-100">
                <span class="text-muted small text-uppercase fw-semibold mb-2">Category Breakdown</span>
                <div id="categoryBreakdown" class="d-flex flex-wrap gap-2 mt-1">
                    <span class="text-muted small">No expenses recorded for this period.</span>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Add Expense Form -->
        <div class="col-lg-4">
            <div class="card p-4">
                <h5 class="fw-bold mb-3">Add New Expense</h5>
                <form id="expenseForm">
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" id="description" class="form-control" placeholder="e.g., Grocery shopping" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" id="amount" class="form-control" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select id="category" class="form-select" required>
                            <option value="FOOD">FOOD</option>
                            <option value="TRANSPORT">TRANSPORT</option>
                            <option value="UTILITIES">UTILITIES</option>
                            <option value="ENTERTAINMENT">ENTERTAINMENT</option>
                            <option value="HEALTHCARE">HEALTHCARE</option>
                            <option value="SHOPPING">SHOPPING</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="expenseDate" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-semibold">Save Expense</button>
                </form>
            </div>
        </div>

        <!-- Expense List Table -->
        <div class="col-lg-8">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Recent Expenses</h5>
                    <select id="filterCategory" class="form-select form-select-sm w-auto">
                        <option value="">All Categories</option>
                        <option value="FOOD">FOOD</option>
                        <option value="TRANSPORT">TRANSPORT</option>
                        <option value="UTILITIES">UTILITIES</option>
                        <option value="ENTERTAINMENT">ENTERTAINMENT</option>
                        <option value="HEALTHCARE">HEALTHCARE</option>
                        <option value="SHOPPING">SHOPPING</option>
                        <option value="OTHER">OTHER</option>
                    </select>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th class="text-end">Amount</th>
                            <th class="text-end">Action</th>
                        </tr>
                        </thead>
                        <tbody id="expenseTableBody">
                        <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/expenses';

    // Default date picker to today
    document.getElementById('expenseDate').valueAsDate = new Date();

    async function loadDashboard() {
        await Promise.all([loadExpenses(), loadSummary()]);
    }

    async function loadExpenses() {
        const category = document.getElementById('filterCategory').value;
        const url = category ? `${API_URL}?category=${category}` : API_URL;
        const res = await fetch(url);
        const expenses = await res.json();

        const tbody = document.getElementById('expenseTableBody');
        if (expenses.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No expenses found. Add your first expense on the left!</td></tr>';
            return;
        }

        tbody.innerHTML = expenses.map(exp => `
            <tr>
                <td>${exp.expenseDate}</td>
                <td class="fw-medium">${exp.description}</td>
                <td><span class="badge bg-secondary">${exp.category}</span></td>
                <td class="text-end fw-semibold">₹${Number(exp.amount).toFixed(2)}</td>
                <td class="text-end">
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteExpense(${exp.id})">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function loadSummary() {
        const res = await fetch(`${API_URL}/summary`);
        const summary = await res.json();

        document.getElementById('totalSpent').textContent = `₹${Number(summary.totalSpent || 0).toFixed(2)}`;
        document.getElementById('dateRangeText').textContent = `From ${summary.startDate} to ${summary.endDate}`;

        const breakdownContainer = document.getElementById('categoryBreakdown');
        if (!summary.categoryBreakdown || summary.categoryBreakdown.length === 0) {
            breakdownContainer.innerHTML = '<span class="text-muted small">No expenses recorded for this period.</span>';
            return;
        }

        breakdownContainer.innerHTML = summary.categoryBreakdown.map(item => `
            <div class="border rounded px-3 py-2 bg-light">
                <div class="small text-muted fw-semibold">${item.category}</div>
                <div class="fw-bold">₹${Number(item.totalAmount).toFixed(2)}</div>
            </div>
        `).join('');
    }

    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            description: document.getElementById('description').value,
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            expenseDate: document.getElementById('expenseDate').value
        };

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
            loadDashboard();
        } else {
            alert('Failed to save expense. Please check all fields.');
        }
    });

    async function deleteExpense(id) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadDashboard();
    }

    document.getElementById('filterCategory').addEventListener('change', loadExpenses);

    loadDashboard();
</script>
</body>
</html>
